name: Security Scan

# Runs free security scanners on every push and pull request.
# Drop this file into .github/workflows/ in your repo.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so secrets in old commits are caught
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto          # auto-selects rulesets for your languages

  dependency-and-fs-scan:
    name: Dependencies & filesystem (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'        # fail the build on CRITICAL/HIGH findings
          ignore-unfixed: true

