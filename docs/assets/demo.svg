<text class="title" x="460" y="23" text-anchor="middle">Claude Code with the PreflightKit deploy gate (illustration)</text>
<text class="l l0 user" x="24" y="64">&gt; deploy the app to production</text>
<text class="l l1 tool" x="24" y="88">● Bash(vercel --prod)</text>
<text class="l l2 bad" x="24" y="112">  ⎿  PreflightKit stopped this deploy: the security check found blocking issues.</text>
<text class="l l3 bad" x="24" y="136">     - [fail] gitleaks found potential secrets (src/lib/payments.ts:4)</text>
<text class="l l4 bad" x="24" y="160">     - [fail] trivy found HIGH,CRITICAL vulnerabilities (lodash 4.17.15: CVE-2021-23337)</text>
<text class="l l5 text" x="24" y="208">● I didn’t deploy. Moving the key to an environment variable and upgrading</text>
<text class="l l6 text" x="24" y="232">  lodash to 4.17.21. Please rotate the leaked key with your provider.</text>
<text class="l l7 tool" x="24" y="280">● Bash(npx preflightkit)</text>
<text class="l l8 dim" x="24" y="304">  ⎿  ok: 4   blocking: 0   advisory: 0   scanner errors: 0</text>
<text class="l l9 tool" x="24" y="328">● Bash(vercel --prod)</text>
<text class="l l10 good" x="24" y="352">  ⎿  ✓ Production deployment ready</text>
</svg>
