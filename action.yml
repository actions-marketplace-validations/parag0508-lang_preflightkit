name: 'PreflightKit Security Check'
description: 'Find leaked secrets, vulnerable dependencies and risky code before you ship. Works with PHP, Node, Python, Java, Go, .NET.'
author: 'PreflightKit contributors'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Directory to scan, relative to the repository root.'
    required: false
    default: '.'
  fail-on:
    description: 'When to fail the job: "findings" (secrets, vulnerabilities at or above audit-level, or a scanner that could not run), "warnings" (also advisory findings such as risky code patterns) or "never".'
    required: false
    default: 'findings'
  audit-level:
    description: 'Lowest dependency vulnerability severity that blocks: low, moderate, high or critical. Lower ones are reported as advisory.'
    required: false
    default: 'high'
  include-dev:
    description: 'Also audit development dependencies ("true" or "false").'
    required: false
    default: 'false'
  fail-on-warnings:
    description: 'Deprecated: use fail-on. "true" is the same as fail-on: warnings, "false" as fail-on: never.'
    required: false
    default: ''
  install-tools:
    description: 'Set up gitleaks, Trivy and Semgrep before scanning ("true" or "false"). Requires a Linux runner.'
    required: false
    default: 'true'
  gitleaks-version:
    description: 'gitleaks Docker image tag.'
    required: false
    default: 'v8.30.1'
  trivy-version:
    description: 'Trivy Docker image tag.'
    required: false
    default: '0.76.1'
  semgrep-version:
    description: 'Semgrep version installed from PyPI.'
    required: false
    default: '1.182.1'

outputs:
  exit-code:
    description: '0 when nothing blocks, 1 when a check found something blocking, 2 when a scanner could not run.'
    value: ${{ steps.scan.outputs.exit-code }}
  blocking:
    description: 'Number of blocking findings.'
    value: ${{ steps.scan.outputs.blocking }}
  warnings:
    description: 'Number of checks with advisory findings.'
    value: ${{ steps.scan.outputs.warnings }}
  errors:
    description: 'Number of scanners that could not run.'
    value: ${{ steps.scan.outputs.errors }}

runs:
  using: 'composite'
  steps:
    - name: Set up scanners
      if: ${{ inputs.install-tools == 'true' }}
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || ! command -v docker >/dev/null 2>&1; then
          echo "::warning::PreflightKit installs scanners on Linux runners only. Other checks still run."
          exit 0
        fi
        bin="$RUNNER_TEMP/preflightkit-bin"
        mkdir -p "$bin" "$RUNNER_TEMP/trivy-cache"

        # gitleaks and Trivy run from their official, version-pinned images.
        # The workspace is mounted at the same path and the runner's user ID is
        # used, so file paths and git ownership checks work unchanged.
        cat > "$bin/gitleaks" <<EOF
        #!/usr/bin/env bash
        exec docker run --rm --user "\$(id -u):\$(id -g)" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "\$PWD" \
          "zricethezav/gitleaks:$GITLEAKS_VERSION" "\$@"
        EOF
        cat > "$bin/trivy" <<EOF
        #!/usr/bin/env bash
        exec docker run --rm --user "\$(id -u):\$(id -g)" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "\$PWD" \
          -v "$RUNNER_TEMP/trivy-cache:/cache" -e TRIVY_CACHE_DIR=/cache \
          "aquasec/trivy:$TRIVY_VERSION" "\$@"
        EOF
        chmod +x "$bin/gitleaks" "$bin/trivy"
        echo "$bin" >> "$GITHUB_PATH"
        docker pull -q "zricethezav/gitleaks:$GITLEAKS_VERSION" >/dev/null
        docker pull -q "aquasec/trivy:$TRIVY_VERSION" >/dev/null

        pipx install --quiet "semgrep==$SEMGREP_VERSION"

    - name: Run PreflightKit
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        AUDIT_LEVEL: ${{ inputs.audit-level }}
        INCLUDE_DEV: ${{ inputs.include-dev }}
      run: |
        set +e
        case "$FAIL_ON_WARNINGS" in
          true)  FAIL_ON=warnings; echo "::notice::fail-on-warnings is deprecated. Use fail-on: warnings, or fail-on: findings to fail only on secrets, serious vulnerabilities and scanner errors." ;;
          false) FAIL_ON=never;    echo "::notice::fail-on-warnings is deprecated. Use fail-on: never." ;;
        esac
        case "$FAIL_ON" in
          findings|warnings|never) ;;
          *) echo "::error::fail-on must be findings, warnings or never (got \"$FAIL_ON\")."; exit 2 ;;
        esac
        args=(--audit-level="$AUDIT_LEVEL")
        [ "$INCLUDE_DEV" = "true" ] && args+=(--include-dev)
        [ "$FAIL_ON" = "warnings" ] && args+=(--strict)
        bash "$GITHUB_ACTION_PATH/scripts/security-check.sh" "${args[@]}" "$SCAN_PATH"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ] && [ "$FAIL_ON" != "never" ]; then
          if [ "$code" -eq 1 ]; then
            echo "::error::PreflightKit found blocking issues. See the job summary and log."
          else
            echo "::error::A PreflightKit scanner could not run, so part of the check is missing. See the log."
          fi
          exit "$code"
        fi
        exit 0
