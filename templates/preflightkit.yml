# PreflightKit: security checks on every push and pull request.
# Copy to .github/workflows/preflightkit.yml, or run: npx preflightkit init
#
# Third-party actions are pinned to full commit SHAs, so a moved tag can't
# change what runs in your pipeline.

name: PreflightKit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Ship-readiness security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, so secrets in old commits are caught

      # Optional: set up your language so its native dependency audit runs too.
      # Trivy already scans dependencies for every ecosystem.
      # - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #   with: { node-version: 22 }
      # - run: npm ci

      - uses: parag0508-lang/preflightkit@v1
        with:
          path: .
          # findings: fail on leaked secrets, vulnerable dependencies at or above
          #   audit-level, or a scanner that could not run. Risky code patterns
          #   and Semgrep results are shown as advisory annotations.
          # warnings: also fail on advisory findings.  never: report only.
          fail-on: findings
          audit-level: high      # low | moderate | high | critical
          # include-dev: true    # also audit development dependencies
          # upload-sarif: true   # show findings in the Security tab and on pull requests;
          #                      # also add `security-events: write` under permissions above

  # Block deploys until the check passes. Pick the one that fits:
  #
  # A) You deploy from this workflow: uncomment and fill in the deploy job.
  #    `needs: preflight` means it only runs when the check above passed.
  #
  # deploy:
  #   needs: preflight
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - run: ./deploy.sh   # your deploy command
  #
  # B) Your host deploys on merge (Vercel, Netlify, Render, Hostinger, ...):
  #    in GitHub, go to Settings > Rules > Rulesets > New branch ruleset, target
  #    your main branch, turn on "Require status checks to pass" and add
  #    "Ship-readiness security check". Pull requests can't merge, and so can't
  #    deploy, until PreflightKit passes.
